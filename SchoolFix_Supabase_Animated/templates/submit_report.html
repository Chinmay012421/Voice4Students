{% extends "base.html" %}
{% block title %}New Report — SchoolFix{% endblock %}
{% block content %}
<div class="form-page reveal">
  <div class="section-head"><div><div class="eyebrow">STUDENT REPORT</div><h1>Tell us what needs fixing.</h1><p class="muted">Be specific. Clear reports are easier to act on.</p></div></div>
  <form class="panel form-grid" method="post" enctype="multipart/form-data">
    <div>
      <label>Category</label>
      <select name="category" required>
        <option value="">Choose a category</option>
        <option>Cleanliness</option><option>Safety</option><option>Facilities</option><option>Bullying</option><option>Teaching</option><option>Transport</option><option>Technology</option><option>Other</option>
      </select>
    </div>
    <div><label>Location</label><input name="location" placeholder="e.g. Block B, Room 204"></div>
    <div class="full-col"><label>What happened?</label><textarea name="description" rows="7" maxlength="5000" required placeholder="Describe the issue clearly..."></textarea></div>
    <div class="full-col"><label>Photos (optional, max 5)</label><input type="file" name="photos" accept=".png,.jpg,.jpeg,.webp" multiple></div>
    <div class="full-col"><button class="btn" type="submit">Submit Report</button></div>
  </form>
</div>
{% endblock %}
