{% extends "base.html" %}
{% block title %}Login — SchoolFix{% endblock %}
{% block content %}
<div class="auth-wrap reveal">
  <div class="auth-card">
    <div class="eyebrow">WELCOME BACK</div>
    <h1>Login</h1>
    <p class="muted">Enter your SchoolFix account.</p>
    <form method="post">
      <label>Username</label>
      <input name="username" autocomplete="username" required>
      <label>Password</label>
      <div class="password-wrap">
        <input id="password" type="password" name="password" autocomplete="current-password" required>
        <button type="button" class="eye" onclick="togglePassword('password',this)">Show</button>
      </div>
      <button class="btn full" type="submit">Login</button>
    </form>
    <p class="center muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
<script>
function togglePassword(id,b){const x=document.getElementById(id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'Show':'Hide'}
</script>
{% endblock %}
