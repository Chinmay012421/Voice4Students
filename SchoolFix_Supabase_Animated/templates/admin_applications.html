{% extends "base.html" %}
{% block title %}Admin Applications — SchoolFix{% endblock %}
{% block content %}
<div class="section-head reveal"><div><div class="eyebrow">MAIN ADMIN</div><h1>Admin applications</h1></div></div>
<div class="panel reveal">
{% for a in applications %}
<div class="application"><div><strong>{{ a[1] }}</strong><p>{{ a[2] }}</p><small>{{ a[4] }}</small></div><div class="actions">
<form method="post" action="{{ url_for('approve_admin', application_id=a[0]) }}"><button class="btn">Approve</button></form>
<form method="post" action="{{ url_for('reject_admin', application_id=a[0]) }}"><button class="btn btn-danger">Reject</button></form>
</div></div>
{% else %}<div class="empty">No pending applications.</div>{% endfor %}
</div>
{% endblock %}
