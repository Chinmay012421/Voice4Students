{% extends "base.html" %}
{% block title %}Change Password — SchoolVoice{% endblock %}
{% block content %}
<div class="center-form reveal"><div class="form-intro"><div class="eyebrow"><span></span> ACCOUNT SECURITY</div><h1>Change password.</h1><p>Keep your account secure with a password only you know.</p></div><form class="form-card" method="post"><div class="form-card-head"><h2>Update password</h2><p>Use at least 6 characters.</p></div><label>Current password</label><input type="password" name="current_password" required placeholder="Current password"><label>New password</label><input type="password" name="new_password" minlength="6" required placeholder="New password"><label>Confirm new password</label><input type="password" name="confirm_password" minlength="6" required placeholder="Repeat new password"><div class="form-actions"><a class="btn btn-light" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn btn-primary" type="submit">Change password <span>→</span></button></div></form></div>
{% endblock %}
