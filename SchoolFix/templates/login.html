{% extends "base.html" %}{% block title %}Login — SchoolFix{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><p class="eyebrow">Welcome back</p><h1>Log in to SchoolFix</h1>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}{% if message %}<div class="alert success">{{ message }}</div>{% endif %}<form method="post"><label>Username<input name="username" required></label><label>Password<input type="password" name="password" required></label><button class="btn primary full">Login</button></form><p class="muted">New student? <a href="/register">Create an account</a></p></div></div>{% endblock %}
