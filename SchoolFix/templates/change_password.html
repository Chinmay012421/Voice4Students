{% extends "base.html" %}{% block title %}Change Password — SchoolFix{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
<p class="eyebrow">Security</p><h1>Change your password</h1>
<div class="alert success">Your temporary password has been used. Choose a new password now.</div>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post">
<label>New password<input type="password" name="new_password" minlength="8" required></label>
<label>Confirm password<input type="password" name="confirm_password" minlength="8" required></label>
<button class="btn primary full" type="submit">Set New Password</button>
</form>
</div></div>{% endblock %}
